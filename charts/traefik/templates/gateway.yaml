{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ required "gateway.name is required" .Values.gateway.name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ required "gateway.clusterIssuer is required" .Values.gateway.clusterIssuer | quote }}
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    {{- range .Values.gateway.hosts }}
    - name: https-{{ . | replace "." "-" }}
      hostname: {{ . | quote }}
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ . | replace "." "-" }}-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
{{- end }}