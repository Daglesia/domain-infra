gateway:
  enabled: true
  name: main
  clusterIssuer: letsencrypt-issuer
  hosts:
    - daglesia.com
    - git.daglesia.com
    - auth.daglesia.com
    - design.daglesia.com
    - docs.daglesia.com
    - notflix.daglesia.com
    - automation.daglesia.com
    - analytics.daglesia.com
    - achievement-huntress.daglesia.com
    - sheets.daglesia.com

traefik:
  ingressClass:
    enabled: false

  providers:
    kubernetesIngress:
      enabled: false

    kubernetesIngressNGINX:
      enabled: true
      ingressClass: nginx
      controllerClass: k8s.io/ingress-nginx

    kubernetesGateway:
      enabled: true

  gateway:
    enabled: false

  gatewayClass:
    enabled: true

  service:
    type: LoadBalancer

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi

  nodeSelector:
    kubernetes.io/hostname: dag-mini-pc