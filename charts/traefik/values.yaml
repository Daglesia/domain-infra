gateway:
  enabled: false            # PHASE 2: set true after Gateway API CRDs are installed
  hosts:
    - daglesia.com
    - git.daglesia.com
    - auth.daglesia.com
    - design.daglesia.com
    - docs.daglesia.com
    - notflix.daglesia.com
    - automation.daglesia.com
    - analytics.daglesia.com
    - achievement-huntress.daglesia.com

traefik:
  # We create the "nginx" IngressClass ourselves (templates/ingressclass.yaml),
  # so don't let the chart create a "traefik" one.
  ingressClass:
    enabled: false

  providers:
    # Plain Ingress provider off: the NGINX provider below handles Ingresses,
    # and having both would create duplicate routers.
    kubernetesIngress:
      enabled: false

    # Reads existing Ingresses + nginx.ingress.kubernetes.io/* annotations.
    # NOTE: capital "NGINX" on chart v40+.
    kubernetesIngressNGINX:
      enabled: true
      ingressClass: nginx
      controllerClass: k8s.io/ingress-nginx

    # PHASE 2: set true once the Gateway API CRDs are installed.
    kubernetesGateway:
      enabled: false

  # The chart's own default Gateway: we define our own (templates/gateway.yaml).
  # Leave off in both phases.
  gateway:
    enabled: false

  # PHASE 2: set true together with kubernetesGateway.enabled
  # (creates the "traefik" GatewayClass; needs the CRDs).
  gatewayClass:
    enabled: false

  service:
    # Phase 1 testing: ClusterIP (doesn't touch ports 80/443).
    # CUTOVER: change to LoadBalancer after ingress-nginx is deleted.
    type: ClusterIP

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi

  nodeSelector:
    kubernetes.io/hostname: dag-mini-pc