traefik:
  ingressClass:
    enabled: false

  providers:
    kubernetesIngress:
      enabled: false
    kubernetesIngressNginx:
      enabled: true
      ingressClass: nginx
      controllerClass: k8s.io/ingress-nginx
    kubernetesGateway:
      enabled: false            # turned on in phase 2, after the CRDs exist

  service:
    type: LoadBalancer

  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 192Mi }

  nodeSelector:
    kubernetes.io/hostname: dag-mini-pc