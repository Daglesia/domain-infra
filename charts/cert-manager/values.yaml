cert-manager:
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true
  crds:
    enabled: true
    keep: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  cainjector:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 192Mi
  nodeSelector:
    kubernetes.io/hostname: dag-mini-pc

clusterIssuer:
  name: letsencrypt-issuer
  server: https://acme-v02.api.letsencrypt.org/directory
  email: "magdalena@daglesia.com"
  key: letsencrypt-issuer-key