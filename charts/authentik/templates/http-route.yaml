apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: traefik
      sectionName: https-auth-daglesia-com
  hostnames:
    - auth.daglesia.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: /outpost.goauthentik.io }
      backendRefs:
        - name: ak-outpost-fixed
          port: 9000
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: authentik-server
          port: 80