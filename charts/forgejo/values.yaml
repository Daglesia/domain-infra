constants:
  storage: "25Gi"
  pvc: "forgejo-git-pvc"
  pv: "forgejo-git-pv"
  node_affinity_config:
    node_limit:
      matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - raspberka-ekran

httpRoute:
  enabled: true
  hostname: git.daglesia.com
  service: { name: forgejo-http, port: 3000 }

forgejo:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - raspberka-ekran
  gitea:
    config:
      server:
        LFS_START_SERVER: true
        LFS_HTTP_AUTH_EXPIRY: 30m
        LFS_MAX_FILE_SIZE: 0
      service:
        DISABLE_REGISTRATION: true
      lfs:
        PATH: /data/lfs
      actions:
        ENABLED: true
      packages:
        ENABLED: true
  persistence:
    enabled: true
    create: false
    claimName: forgejo-git-pvc
    volumeName: forgejo-git-pv
    storageClass: local-git-storage
  ingress:
    enabled: false
