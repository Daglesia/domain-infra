apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.web-env.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  {{- $defaults := dict "NEXT_TELEMETRY_DISABLED" "1" -}}
  {{- $env := merge (deepCopy $defaults) .Values.web.env -}}
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
