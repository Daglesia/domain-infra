constants:
  storage: "200Gi"
  pvc: "jellyfin-media-pvc"
  pv: "jellyfin-media-pv"
  node_affinity_config:
    node_limit: 
      matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - dag-mini-pc

httpRoute:
  enabled: true
  hostname: notflix.daglesia.com
  service: { name: jellyfin, port: 8096 }

jellyfin:
  persistence:
    media:
      size: "200Gi"
      existingClaim: "jellyfin-media-pvc"
  ingress:
    enabled: false
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - dag-mini-pc