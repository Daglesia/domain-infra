constants:
  storage: "10Gi"
  pvc: "wiki-docs-pvc"
  pv: "wiki-docs-pv"
  node_affinity_config:
    node_limit:
      matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - dag-mini-pc

httpRoute:
  enabled: true
  hostname: docs.daglesia.com
  service: { name: wikijs, port: 80 }

wiki:
  postgresql:
    enabled: false
  externalPostgresql:
    host: "shared-postgresql-pooler.data.svc.cluster.local"
    port: 5432
    database: "wikijs"
    username: "wikijs"
    existingSecret: "wikijs-db-secret"
    existingSecretKey: "password"
    ssl: false
  ingress:
    enabled: false