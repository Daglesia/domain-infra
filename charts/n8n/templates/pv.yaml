apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.constants.pv }}
spec:
  capacity:
    storage: {{ .Values.constants.storage }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.constants.storageClass }}
  local:
    path: {{ .Values.constants.path | quote }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            {{- toYaml .Values.constants.node_affinity_config.node_limit.matchExpressions | nindent 12 }}