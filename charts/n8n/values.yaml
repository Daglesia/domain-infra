constants:
  storage: "5Gi"
  pvc: "n8n-data-pvc"
  pv: "n8n-data-pv"
  storageClass: "n8n-data-sc"
  path: "/n8n"
  node_affinity_config:
    node_limit:
      matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - dag-mini-pc

n8n:
  image:
    repository: n8nio/n8n
    tag: "2.41.3"

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-issuer
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - host: automation.daglesia.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: n8n-tls
        hosts:
          - automation.daglesia.com

  main:
    extraEnv:
      WEBHOOK_URL:
        value: "https://automation.daglesia.com/"
      N8N_EDITOR_BASE_URL:
        value: "https://automation.daglesia.com/"
      N8N_PROXY_HOPS:
        value: "1"
      N8N_HOST:
        value: "automation.daglesia.com"
      N8N_PROTOCOL:
        value: "https"

    config:
      db:
        type: postgresdb
        postgresdb:
          host: shared-postgresql-pooler.data.svc.cluster.local
          port: 5432
          database: n8n
          user: n8n

    persistence:
      enabled: true
      type: existing
      existingClaim: n8n-data-pvc
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        memory: 4012Mi

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - dag-mini-pc