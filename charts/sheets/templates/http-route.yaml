{{- if .Values.grist.httpRoute.enabled }}
{{- $name := include "grist.name" . }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-authentik
  labels:
    {{- include "grist.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.grist.httpRoute.authAddress | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - Set-Cookie
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "grist.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: traefik
      sectionName: https-{{ .Values.grist.httpRoute.hostname | replace "." "-" }}
  hostnames:
    - {{ .Values.grist.httpRoute.hostname | quote }}
  rules:
    {{- range .Values.grist.httpRoute.loginPaths }}
    - matches:
        - path: { type: PathPrefix, value: {{ . }} }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $name }}-authentik
      backendRefs:
        - name: {{ $name }}
          port: {{ $.Values.grist.service.port }}
    {{- end }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ $name }}
          port: {{ .Values.grist.service.port }}
{{- end }}