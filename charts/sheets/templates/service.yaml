apiVersion: v1
kind: Service
metadata:
  name: {{ include "grist.name" . }}
  labels:
    {{- include "grist.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.grist.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "grist.selectorLabels" . | nindent 4 }}