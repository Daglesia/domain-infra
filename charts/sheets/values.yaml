constants:
  storage: "5Gi"
  pvc: "grist-data-pvc"
  pv: "grist-data-pv"
  storageClass: "grist-data-sc"
  path: "/grist"
  node_affinity_config:
    node_limit:
      matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - dag-mini-pc

grist:
  image:
    # grist-oss = only open-source code. Same features as gristlabs/grist by default.
    repository: gristlabs/grist-oss
    # TODO: pin to a specific release instead of "latest" (check Docker Hub).
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 8484

  # Plain env vars (ConfigMap-free, rendered straight into the container).
  # Secrets (GRIST_SESSION_SECRET, GRIST_BOOT_KEY) live in secrets.yaml -> grist.secretEnv.
  env:
    APP_HOME_URL: "https://sheets.daglesia.com"
    # Authentik forward-auth: Grist trusts this header for the user's email.
    GRIST_FORWARD_AUTH_HEADER: "x-authentik-email"
    GRIST_FORWARD_AUTH_LOGIN_PATH: "/auth/login"
    # No anonymous access at all.
    GRIST_FORCE_LOGIN: "true"
    # Skip the first-run Quick setup gate; admin panel is reachable via GRIST_BOOT_KEY at /admin.
    GRIST_IN_SERVICE: "true"
    # Safer than the default (SYNCHRONOUS=off) after a hard power loss.
    GRIST_SQLITE_MODE: "wal"
    GRIST_TELEMETRY_LEVEL: "off"

  ingress:
    enabled: true
    className: nginx
    host: sheets.daglesia.com
    tlsSecret: grist-tls
    # Main ingress: everything EXCEPT the login path is open at nginx level, so the
    # REST API keeps working with Bearer API keys. Grist itself enforces login.
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-issuer
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Second ingress: only the forward-auth login path goes through the Authentik outpost.
    loginPaths:
      - /auth/login
    loginAnnotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/auth-url: "http://ak-outpost-fixed.default.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx"
      nginx.ingress.kubernetes.io/auth-signin: "https://auth.daglesia.com/outpost.goauthentik.io/start?rd=https://$host$escaped_request_uri"
      nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
      nginx.ingress.kubernetes.io/proxy-add-original-uri-header: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"

  livenessProbe:
    enabled: true
    path: /status
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /status
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - dag-mini-pc

  # Filled from secrets.yaml (SOPS)
  secretEnv: {}