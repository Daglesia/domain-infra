constants:
  storage: "5Gi"
  pvc: "grist-data-pvc"
  pv: "grist-data-pv"
  storageClass: "grist-data-sc"
  path: "/grist"
  node_affinity_config:
    node_limit:
      matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - dag-mini-pc

grist:
  image:
    # grist-oss = only open-source code. Same features as gristlabs/grist by default.
    repository: gristlabs/grist-oss
    # TODO: pin to a specific release instead of "latest" (check Docker Hub).
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 8484

  # Plain env vars (ConfigMap-free, rendered straight into the container).
  # Secrets (GRIST_SESSION_SECRET, GRIST_BOOT_KEY) live in secrets.yaml -> grist.secretEnv.
  env:
    APP_HOME_URL: "https://sheets.daglesia.com"
    # Authentik forward-auth: Grist trusts this header for the user's email.
    GRIST_FORWARD_AUTH_HEADER: "x-authentik-email"
    GRIST_FORWARD_AUTH_LOGIN_PATH: "/auth/login"
    # No anonymous access at all.
    GRIST_FORCE_LOGIN: "true"
    # Skip the first-run Quick setup gate; admin panel is reachable via GRIST_BOOT_KEY at /admin.
    GRIST_IN_SERVICE: "true"
    # Safer than the default (SYNCHRONOUS=off) after a hard power loss.
    GRIST_SQLITE_MODE: "wal"
    GRIST_TELEMETRY_LEVEL: "off"

  httpRoute:
    enabled: true
    hostname: sheets.daglesia.com
    loginPaths:
      - /auth/login
    authAddress: http://ak-outpost-fixed.default.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik

  livenessProbe:
    enabled: true
    path: /status
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /status
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - dag-mini-pc

  # Filled from secrets.yaml (SOPS)
  secretEnv: {}